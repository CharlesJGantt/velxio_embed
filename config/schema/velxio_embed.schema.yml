velxio_embed.settings:
  type: config_object
  label: 'Velxio Embed settings'
  mapping:
    base_url:
      type: string
      label: 'Velxio instance base URL'
    default_embed_height:
      type: integer
      label: 'Default embed height (pixels)'
    save_api_token_hash:
      type: string
      label: 'Hash of the API token authorizing the Save-to-Media-Library endpoint (raw token is never stored)'
    save_allowed_origins:
      type: sequence
      label: 'Origins allowed to call the Save-to-Media-Library endpoint (CORS)'
      sequence:
        type: string
